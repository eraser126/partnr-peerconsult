# @package _global_
# PeerConsult V4 keeps the V2 PARTNR prompt and skills, adding only factual
# coordination at the proposal/execution boundary.
defaults:
  - /examples/planner_multi_agent_demo_config
  - override /evaluation: peer_consult_decentralized_evaluation_runner_multi_agent
  - override /planner@evaluation.agents.agent_0.planner: peer_consult_zero_shot_react_planner
  - override /instruct@evaluation.agents.agent_0.planner.plan_config.instruct: peer_consult_zero_shot_prompt
  - override /agent@evaluation.agents.agent_0.config: oracle_rearrange_agent_motortoolsonly
  - override /planner@evaluation.agents.agent_1.planner: peer_consult_zero_shot_react_planner
  - override /instruct@evaluation.agents.agent_1.planner.plan_config.instruct: peer_consult_zero_shot_prompt
  - override /agent@evaluation.agents.agent_1.config: oracle_rearrange_object_states_agent_motortoolsonly
  - _self_

agent_asymmetry: True
world_model:
  partial_obs: True

evaluation:
  peerconsult:
    claim_ttl_decisions: 3
    max_targets: 5
    max_rooms: 4
    max_reviews: 2
    max_execution_facts: 6
    max_ledger_entries: 8
    max_public_report_chars: 480
    # Rule-based safeguards operate only over public action/executor facts;
    # they never reveal another agent's raw observations or evaluator state.
    publish_exploration_reports: false
    enforce_room_exploration_dedup: true
    enforce_required_recovery: true
    enforce_placement_stability: false
    # V2-style PARTNR collaboration aid. It shares only compact typed
    # object-location facts; set false for the strict-privacy ablation.
    share_discovered_locations: true
    max_shared_locations: 5
    # Rule-based execution watchdog: abort only a motor skill that has not
    # reached any terminal executor response for five minutes.
    max_action_wall_time_s: 300
  no_progress_guard:
    enabled: true
    min_elapsed_seconds: 300
    decision_window: 8
    max_elapsed_seconds: 900
  agents:
    agent_0:
      planner:
        plan_config:
          constrained_generation: True
          objects_response: True
          replanning_threshold: 50
          llm:
            inference_mode: "rlm"
    agent_1:
      planner:
        plan_config:
          constrained_generation: True
          objects_response: True
          replanning_threshold: 50
          llm:
            inference_mode: "rlm"
