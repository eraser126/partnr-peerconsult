llm:
  _target_: habitat_llm.llm.OpenAIChat
  _partial_: True

verbose: True
system_message: >-
  You are an expert at embodied task planning. Follow the requested ReAct
  format exactly. Do not use Markdown fences, XML thinking tags, or prose
  after the final action. Keep Thought concise (at most two sentences) and
  do not repeat it. Complete every allowed skill call required by the
  requested format before Assigned!. Each skill call must use the exact form
  SkillName[arguments].
system_tag: ''
user_tag: ''
assistant_tag: ''
eot_tag: ''
keep_message_history: False
# Shared input limit for both PeerConsult V4 and the centralized ReAct
# baseline. The cap is measured with Qwen's chat template, not characters.
input_token_budget: ${oc.env:PARTNR_INPUT_TOKEN_BUDGET,12000}
input_tokenizer_path: ${oc.env:PARTNR_QWEN_TOKENIZER_PATH,/data/user/hd68631/models/Qwen3-VL-4B-Instruct}
prompt_head_token_budget: 3500
prompt_tail_min_tokens: 1024
# Transient gateway errors (including HTTP 503 wrapped as APIConnectionError)
# are retried with bounded exponential backoff.  Invalid requests and context
# errors are deliberately not retried.
max_transient_attempts: 6
retry_base_delay_s: 3
retry_max_delay_s: 60
# Agent-specific scripts may set this for agent 1 to avoid a simultaneous
# first request from both PeerConsult agents.
initial_request_delay_s: 0

generation_params:
  model: ${oc.env:PARTNR_MODEL,qwen/qwen3-vl-4b}
  # Action planning responses are normally short.  This also leaves room for
  # the input prompt when the gateway enforces a small effective context window.
  max_tokens: 256
  temperature: 0
  top_p: 1
  stream: False
  stop: 'Assigned!'
  frequency_penalty: 0
  presence_penalty: 0
  request_timeout: 300
